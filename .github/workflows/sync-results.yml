name: Sync match results

# Calls the sync-results endpoint after known World Cup match windows so
# scores land promptly when matches finish.
#
# Why not */5 * * * *?
#   GitHub's scheduler deprioritises high-frequency schedules under load and
#   can delay or drop runs entirely — exactly when matches are live and we
#   need reliability most.  By targeting only the hours when matches can be
#   active (June–July, 15:00–02:00 UTC) at a 15-minute cadence, we submit
#   ~52 jobs/day instead of 288, which schedulers pick up far more reliably.
#   The sync-results endpoint already skips the football-data.org call when
#   no match is in its active window (kickoff ±3 h), so off-day runs are
#   cheap (single DB count, no upstream request).
#
# Match windows (UTC):
#   World Cup 2026 typical kickoffs: ~16:00, ~19:00, ~22:00, ~01:00 UTC.
#   Each match can run up to ~2 h 45 min (90 min + ET + pens + HT break).
#
# Required GitHub Actions secret (Settings → Secrets and variables → Actions):
#   CRON_SECRET — same value as the CRON_SECRET env var on Railway.
#
# Optional repository variable:
#   APP_URL — defaults to https://cupamondiala.andrei42.com if unset.

on:
  schedule:
    # Every 15 min during peak match hours (15:00–23:59 UTC), June–July.
    - cron: "*/15 15-23 * 6-7 *"
    # Every 15 min for late/midnight matches (00:00–01:59 UTC), June–July.
    - cron: "*/15 0-1 * 6-7 *"
    # Once per hour during off-hours (02:00–14:59 UTC), June–July.
    # Catches any delayed or rescheduled matches without burning runner slots.
    - cron: "0 2-14 * 6-7 *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://cupamondiala.andrei42.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository."
            exit 1
          fi
          echo "POST $APP_URL/api/admin/sync-results"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/admin/sync-results")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected HTTP $code"
            exit 1
          fi
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::Sync endpoint reported failure"
            exit 1
          fi
