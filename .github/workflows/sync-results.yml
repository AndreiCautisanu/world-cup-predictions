name: Sync match results

# Calls the sync-results endpoint every 5 minutes so scores land within
# 5 minutes of a match finishing. football-data.org free tier allows
# 10 req/min so one call per run is well within limits.
#
# Required GitHub Actions secret (Settings -> Secrets and variables -> Actions):
#   CRON_SECRET — same value as the CRON_SECRET env var on Railway.
#
# Optional repository variable:
#   APP_URL — defaults to https://cupamondiala.andrei42.com if unset.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://cupamondiala.andrei42.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository."
            exit 1
          fi
          echo "POST $APP_URL/api/admin/sync-results"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/admin/sync-results")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected HTTP $code"
            exit 1
          fi
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::Sync endpoint reported failure"
            exit 1
          fi
